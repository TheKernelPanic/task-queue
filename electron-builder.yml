appId: com.thekernelpanic.taskqueue
productName: TaskQueue
directories:
  output: release
  buildResources: build
files:
  - out/**
  - package.json
asar: true
win:
  target:
    - target: nsis
      arch: [x64]
  icon: src/renderer/public/icon.ico
nsis:
  # One-click per-user install in %LOCALAPPDATA%\Programs\TaskQueue (no admin rights needed).
  oneClick: true
  perMachine: false
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: TaskQueue
  runAfterFinish: true
  # User data lives in %APPDATA%\task-queue and must survive updates and uninstalls.
  deleteAppDataOnUninstall: false
  artifactName: ${productName}-Setup-${version}.${ext}
  installerIcon: src/renderer/public/icon.ico
  uninstallerIcon: src/renderer/public/icon.ico
publish: null
